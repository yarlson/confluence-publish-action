version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches the 7-day minimum release age that local installs use.
    cooldown:
      default-days: 7
    groups:
      runtime:
        dependency-type: production
        patterns: ["*"]
      development:
        dependency-type: development
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
